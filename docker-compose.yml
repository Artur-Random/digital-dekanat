# Локальная база для разработки. На сервере будет отдельный compose (задание про деплой).
services:
  db:
    image: postgres:18.6-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?задайте POSTGRES_USER в .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?задайте POSTGRES_PASSWORD в .env}
      POSTGRES_DB: ${POSTGRES_DB:?задайте POSTGRES_DB в .env}
      TZ: Europe/Moscow
    ports:
      # Только локальный интерфейс: база не должна быть видна из сети.
      - "127.0.0.1:5432:5432"
    volumes:
      # С PostgreSQL 18 данные лежат в подкаталоге версии, монтируем родительский каталог.
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

volumes:
  pgdata:
