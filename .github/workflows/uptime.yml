# Uptime monitor: /api/health must answer db ok; after 04:30 Moscow time the nightly demo reset
# must be dated today. On failure an issue labelled "uptime" is opened (or commented), and the run
# fails, so GitHub emails the owner. When everything is fine again the issue is closed.
#
# GitHub runners are outside Russia: this does NOT confirm availability from Russia.
name: uptime

on:
  schedule:
    # Hourly while the repository is private (2000 Actions minutes per month).
    # After the repository becomes public, switch to "*/15 * * * *".
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: uptime
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      SITE_URL: ${{ vars.SITE_URL }}
    steps:
      - name: Probe /api/health
        id: probe
        run: |
          if [ -z "$SITE_URL" ]; then
            echo "SITE_URL не задан, проверка пропущена" | tee -a "$GITHUB_STEP_SUMMARY"
            echo "state=skip" >> "$GITHUB_OUTPUT"; exit 0
          fi
          body=""
          for _ in 1 2 3; do
            body="$(curl -fsS --max-time 20 "$SITE_URL/api/health" || true)"
            [ -n "$body" ] && break
            sleep 20
          done
          problem=""
          if [ -z "$body" ]; then
            problem="$SITE_URL/api/health не отвечает (3 попытки)"
          elif [ "$(echo "$body" | jq -r '.db // empty')" != "ok" ]; then
            problem="база недоступна: db != ok"
          else
            now="$(TZ=Europe/Moscow date +%H%M)"
            today="$(TZ=Europe/Moscow date +%F)"
            reset="$(echo "$body" | jq -r '.demoResetAt // empty')"
            # Only a well-formed timestamp goes further (it ends up in step outputs and the issue).
            [[ "$reset" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9:]{8}\+03:00$ ]] || reset=""
            if [ "$now" -ge 0430 ] && [ "${reset:0:10}" != "$today" ]; then
              problem="ночной сброс демо-данных не прошёл сегодня (demoResetAt: ${reset:-нет})"
            fi
          fi
          version="$(echo "$body" | jq -r '.version // empty' 2>/dev/null || true)"
          [[ "$version" =~ ^[0-9a-z]{1,40}$ ]] || version=""
          if [ -n "$problem" ]; then
            echo "state=fail" >> "$GITHUB_OUTPUT"
            echo "problem=$problem" >> "$GITHUB_OUTPUT"
            echo "Сбой: $problem" | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "state=ok" >> "$GITHUB_OUTPUT"
            echo "OK: db ok, version ${version:-?}" | tee -a "$GITHUB_STEP_SUMMARY"
          fi

      - name: Open, comment or close the uptime issue
        if: steps.probe.outputs.state != 'skip'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          STATE: ${{ steps.probe.outputs.state }}
          PROBLEM: ${{ steps.probe.outputs.problem }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh label create uptime --color B60205 --description "Мониторинг доступности" \
            >/dev/null 2>&1 || true
          number="$(gh issue list --label uptime --state open --json number --jq '.[0].number')"
          stamp="$(TZ=Europe/Moscow date '+%d.%m.%Y %H:%M') МСК"
          if [ "$STATE" = "fail" ]; then
            text="$stamp: $PROBLEM. Запуск: $RUN_URL"
            if [ -n "$number" ]; then
              gh issue comment "$number" --body "$text"
            else
              gh issue create --label uptime --title "Сайт недоступен или сброс не прошёл" \
                --body "$text"
            fi
            exit 1
          fi
          if [ -n "$number" ]; then
            gh issue comment "$number" --body "$stamp: снова всё в порядке. Запуск: $RUN_URL"
            gh issue close "$number"
          fi
