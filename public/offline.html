<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Нет соединения · Студкаб</title>
    <style>
      body {
        margin: 0;
        font-family: system-ui, sans-serif;
        background: #ffffff;
        color: #14213d;
      }
      .banner {
        background: #fff6d6;
        color: #4a3b00;
        padding: calc(0.5rem + env(safe-area-inset-top, 0px)) 1rem 0.5rem;
        font-size: 0.875rem;
      }
      main {
        padding: 2rem max(1rem, env(safe-area-inset-left));
        max-width: 28rem;
        margin: 0 auto;
      }
      img {
        height: 3rem;
        width: auto;
      }
      a {
        display: inline-flex;
        align-items: center;
        min-height: 2.75rem;
        margin-top: 1.5rem;
        padding: 0 1rem;
        border-radius: 0.375rem;
        background: #14213d;
        color: #ffffff;
        text-decoration: none;
        font-weight: 600;
      }
      p {
        color: #4b5262;
        line-height: 1.5;
      }
    </style>
  </head>
  <body>
    <div class="banner" role="note">
      Концепт для конкурса MGIMO AI Challenge 2026. Не официальный сервис МГПУ. Все данные
      вымышленные. Демо-данные обновляются каждую ночь.
    </div>
    <main>
      <img src="/brand/studcab-logo-light.svg" alt="Студкаб" />
      <h1>Нет соединения</h1>
      <p>
        Студкаб работает только онлайн: расписание, оценки и заявки не хранятся на устройстве.
        Проверьте интернет и попробуйте ещё раз.
      </p>
      <a href="/">Попробовать снова</a>
    </main>
  </body>
</html>
